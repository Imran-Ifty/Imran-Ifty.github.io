<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#2196F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <link rel="manifest" href="manifest.json">
    <title>Simple Attendance System</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px solid #f0f0f0;
        }
        
        .header h1 {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .header .date-display {
            color: #666;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .control-row {
            display: flex;
            gap: 10px;
        }
        
        select, input, button {
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
            background: white;
            width: 100%;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
            text-align: center;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 18px 12px;
            border-radius: 18px;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #555;
            margin-top: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .student {
            background: #f8f9fa;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .student:hover {
            border-color: #667eea;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .student-info {
            flex: 1;
        }
        
        .student-id {
            font-weight: 700;
            font-size: 1.15rem;
            color: #333;
        }
        
        .student-name {
            color: #666;
            font-size: 0.95rem;
            margin-top: 5px;
            font-weight: 500;
        }
        
        .toggle {
            width: 65px;
            height: 65px;
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .toggle:hover {
            transform: scale(1.1);
        }
        
        .toggle:active {
            transform: scale(0.9);
        }
        
        .absent {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }
        
        .present {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 18px 0;
            flex-wrap: wrap;
        }
        
        .action-btn {
            flex: 1;
            min-width: 130px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .install-btn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 50px;
            padding: 12px 24px;
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 18px; border-radius: 20px; }
            .toggle { width: 60px; height: 60px; font-size: 24px; }
            .stat-number { font-size: 1.8rem; }
            .header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Attendance System</h1>
            <div class="date-display" id="currentDateDisplay"></div>
        </div>
        
        <div class="controls">
            <div class="control-row">
                <input type="date" id="date" style="flex:1">
                <select id="course" style="flex:1">
                    <option value="">📚 Select Course</option>
                    <option value="CSE101">💻 CSE101 - Programming</option>
                    <option value="CSE201">🗄️ CSE201 - Database</option>
                    <option value="CSE301">🌐 CSE301 - Networking</option>
                </select>
            </div>
            <button onclick="loadStudents()">📥 Load Students</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="present" style="color:#11998e">0</div>
                <div class="stat-label">Present</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="absent" style="color:#ff416c">0</div>
                <div class="stat-label">Absent</div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="action-btn" onclick="markAll(1)">✅ All Present</button>
            <button class="action-btn" onclick="markAll(0)">❌ All Absent</button>
        </div>
        
        <div id="students"></div>
    </div>
    
    <button class="install-btn" id="installBtn">📱 Install App</button>

    <script>
        // Set today's date and display
        const today = new Date();
        document.getElementById("date").value = today.toISOString().split("T")[0];
        document.getElementById("currentDateDisplay").textContent = 
            today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        // Course data with students
        const courseData = {
            CSE101: [
                {id: "221152001", name: "Imran Rahman"},
                {id: "221152002", name: "Mahmud Hasan"},
                {id: "221152003", name: "Rakib Ahmed"}
            ],
            CSE201: [
                {id: "221152004", name: "Nayeem Islam"},
                {id: "221152005", name: "Fahim Hossain"},
                {id: "221152006", name: "Tanvir Ahmed"}
            ],
            CSE301: [
                {id: "221152007", name: "Shuvo Das"},
                {id: "221152008", name: "Sajid Rahman"},
                {id: "221152009", name: "Arafat Hossain"}
            ]
        };
        
        // Get storage key
        function getKey() {
            const course = document.getElementById("course").value;
            const date = document.getElementById("date").value;
            return `attendance_${course}_${date}`;
        }
        
        // Load students
        function loadStudents() {
            const course = document.getElementById("course").value;
            
            if (!course) {
                alert("⚠️ Please select a course first!");
                return;
            }
            
            let saved = JSON.parse(localStorage.getItem(getKey())) || {};
            
            const container = document.getElementById("students");
            container.innerHTML = "";
            
            if (!courseData[course]) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>No students found</h3>
                        <p>This course has no enrolled students</p>
                    </div>`;
                updateStats();
                return;
            }
            
            courseData[course].forEach(student => {
                const value = saved[student.id] || 0;
                
                const row = document.createElement("div");
                row.className = "student";
                
                row.innerHTML = `
                    <div class="student-info">
                        <div class="student-id">#${student.id}</div>
                        <div class="student-name">👤 ${student.name}</div>
                    </div>
                    <button 
                        class="toggle ${value ? 'present' : 'absent'}"
                        data-id="${student.id}"
                        onclick="toggleAttendance(this)">
                        ${value ? '✓' : '✗'}
                    </button>
                `;
                
                container.appendChild(row);
            });
            
            updateStats();
        }
        
        // Toggle attendance
        function toggleAttendance(btn) {
            const currentValue = btn.classList.contains('present') ? 1 : 0;
            const newValue = currentValue ? 0 : 1;
            
            // Add animation
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 200);
            
            btn.className = `toggle ${newValue ? 'present' : 'absent'}`;
            btn.textContent = newValue ? '✓' : '✗';
            
            saveAttendance();
        }
        
        // Mark all
        function markAll(value) {
            const buttons = document.querySelectorAll(".toggle");
            
            if (buttons.length === 0) {
                alert("⚠️ Please load students first!");
                return;
            }
            
            buttons.forEach(btn => {
                btn.className = `toggle ${value ? 'present' : 'absent'}`;
                btn.textContent = value ? '✓' : '✗';
            });
            
            saveAttendance();
            
            // Show feedback
            const message = value ? '✅ All marked present!' : '❌ All marked absent!';
            showNotification(message);
        }
        
        // Save to localStorage
        function saveAttendance() {
            const data = {};
            
            document.querySelectorAll(".toggle").forEach(btn => {
                data[btn.dataset.id] = btn.classList.contains('present') ? 1 : 0;
            });
            
            localStorage.setItem(getKey(), JSON.stringify(data));
            updateStats();
        }
        
        // Update statistics
        function updateStats() {
            const buttons = document.querySelectorAll(".toggle");
            const total = buttons.length;
            const present = document.querySelectorAll(".present").length;
            const absent = total - present;
            
            document.getElementById("total").textContent = total;
            document.getElementById("present").textContent = present;
            document.getElementById("absent").textContent = absent;
        }
        
        // Notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #333;
                color: white;
                padding: 12px 24px;
                border-radius: 50px;
                font-weight: 600;
                z-index: 2000;
                animation: fadeIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }
        
        // Event listeners
        document.getElementById("course").addEventListener("change", loadStudents);
        document.getElementById("date").addEventListener("change", function() {
            const course = document.getElementById("course").value;
            if (course) loadStudents();
        });
        
        // PWA Install prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });
        
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
        
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
        });
        
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker error:', err));
            });
        }
    </script>
</body>
</html>
